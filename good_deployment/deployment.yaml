apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
        # This label is what your bash script checks
        app.kubernetes.io/revision: "{{REVISION}}"
    spec:
      containers:
      - name: flask-container
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args: 
          - |
            pip install flask
            python -c "
            from flask import Flask
            import os
            app = Flask(__name__)
            @app.route('/')
            def hello():
                rev = os.getenv('APP_REVISION', 'unknown')
                return f'Revision: {rev}'
            app.run(host='0.0.0.0', port=5000)
            "
        ports:
        - containerPort: 5000
        env:
        - name: APP_REVISION
          value: "{{REVISION}}"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
