name: Deploy Flask App (Minikube)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set kubectl context
      run: |
        echo "Setting kubectl context to minikube"
        kubectl config use-context minikube

    - name: Set deployment revision
      run: |
        REVISION=$(echo "${GITHUB_SHA}" | cut -c1-7)
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    - name: Inject revision into manifest
      run: |
        echo "Injecting revision ${REVISION} into good_deployment/deployment.yaml"
        sed -i "s/{{REVISION}}/${REVISION}/g" good_deployment/deployment.yaml

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f good_deployment/deployment.yaml
        kubectl apply -f good_deployment/service.yaml

    - name: Monitor rollout and handle rollback
      run: |
        echo "Waiting for deployment rollout (Timeout: 180s)..."
        set +e
        kubectl rollout status deployment/flask-app-deployment --timeout=180s
        STATUS=$?
        set -e

        if [ $STATUS -ne 0 ]; then
          echo "DEPLOYMENT FAILED - Analyzing logs..."
          kubectl get pods -l app=flask-app
          kubectl describe deployment flask-app-deployment
          
          REV_COUNT=$(kubectl rollout history deployment/flask-app-deployment | grep -c revision || true)
          if [ "$REV_COUNT" -gt 1 ]; then
            echo "Rolling back to previous stable version..."
            kubectl rollout undo deployment/flask-app-deployment
          else
            echo "No previous version found to roll back to."
          fi
          exit 1
        fi
        echo "DEPLOYMENT ROLLOUT SUCCESSFUL"

        - name: Verify revision matches
      run: |
        # Use a more robust selector to get the label from the first pod
        ACTIVE_REVISION=$(kubectl get pods -l app=flask-app -o jsonpath='{.items[0].metadata.labels.app\.kubernetes\.io/revision}')
        echo "Expected: ${REVISION}, Found: ${ACTIVE_REVISION}"
        if [ "$ACTIVE_REVISION" != "$REVISION" ]; then
          echo "Mismatch detected! The cluster is not running the latest SHA."
          exit 1
        fi


    - name: Final Status
      run: |
        kubectl get svc flask-app-service
        echo "App is accessible via 'minikube service flask-app-service'"
