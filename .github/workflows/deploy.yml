name: Deploy Nginx to Localhost (Minikube)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set kubectl context
      run: kubectl config use-context minikube

    - name: Set deployment revision
      run: |
        REVISION=$(echo "${GITHUB_SHA}" | cut -c1-7)
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    - name: Inject revision into manifests
      run: |
        sed -i "s/{{REVISION}}/${REVISION}/g" manifests/deployment.yaml

    - name: Apply manifests
      run: kubectl apply -f manifests/

    - name: Wait for rollout (with rollback on failure)
      run: |
        set +e
        kubectl rollout status deployment/nginx-deployment --timeout=60s
        STATUS=$?
        set -e

        if [ $STATUS -ne 0 ]; then
          echo "❌ Deployment failed — rolling back to the previous revision"
          kubectl rollout undo deployment/nginx-deployment
          kubectl rollout status deployment/nginx-deployment --timeout=60s
          echo "❌ Deployment failed — rollout to the previous revision completed"
          exit 1
        fi

        echo "✅ Deployment successfully completed"

    - name: Show final deployment state
      run: kubectl get deployment nginx-deployment -o wide
