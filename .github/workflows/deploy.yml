name: Deploy Nginx Deployment Only (Minikube)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set kubectl context
      run: |
        echo "🔧 Setting kubectl context to minikube"
        kubectl config use-context minikube

    - name: Set deployment revision
      run: |
        REVISION=$(echo "${GITHUB_SHA}" | cut -c1-7)
        echo "REVISION=$REVISION" >> $GITHUB_ENV
        echo "📌 Using revision: $REVISION"

    - name: Inject revision into deployment manifest
      run: |
        echo "📝 Injecting revision into deployment.yaml"
        sed -i "s/{{REVISION}}/${REVISION}/g" manifests/deployment.yaml

    - name: Apply deployment manifest only
      run: |
        echo "🚀 Applying Deployment manifest"
        kubectl apply -f manifests/deployment.yaml

    - name: Monitor rollout and rollback on failure
      run: |
        echo "⏳ Waiting for rollout to complete..."
        set +e
        kubectl rollout status deployment/nginx-deployment --timeout=60s
        STATUS=$?
        set -e

        if [ $STATUS -ne 0 ]; then
          echo "❌ Rollout failed!"

          echo "↩️ Rolling back to previous deployment revision"
          kubectl rollout undo deployment/nginx-deployment

          echo "⏳ Waiting for rollback to stabilize"
          kubectl rollout status deployment/nginx-deployment --timeout=60s

          echo "🧹 Deleting unhealthy pods"
          kubectl get pods \
            --selector=app=nginx \
            --field-selector=status.phase!=Running \
            -o name | xargs -r kubectl delete

          echo "❌ Deployment failed and rollback completed"
          exit 1
        fi

        echo "✅ Deployment rollout successful"

    - name: Show final deployment and pod status
      run: |
        echo "📊 Final Deployment Status"
        kubectl get deployment nginx-deployment -o wide
