name: Deploy Nginx Deployment Only (Minikube)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set kubectl context
      run: |
        echo "🔧 Setting kubectl context to minikube"
        kubectl config use-context minikube

    - name: Set deployment revision
      run: |
        REVISION=$(echo "${GITHUB_SHA}" | cut -c1-7)
        echo "REVISION=$REVISION" >> $GITHUB_ENV
        echo "Using revision: $REVISION"

    - name: Inject revision into deployment manifest
      run: |
        echo "Injecting revision into deployment.yaml"
        sed -i "s/{{REVISION}}/${REVISION}/g" manifests/deployment.yaml

    - name: Apply deployment manifest only
      run: |
        echo "Applying Deployment manifest"
        kubectl apply -f manifests/deployment.yaml

    - name: Monitor rollout and handle rollback
      run: |
        echo "Waiting for deployment rollout to complete..."
        set +e
        kubectl rollout status deployment/nginx-deployment --timeout=60s
        STATUS=$?
        set -e

        if [ $STATUS -ne 0 ]; then
          echo ""
          echo "POST-DEPLOYMENT FAILURE DETECTED"
          echo "----------------------------------"
          echo "One or more pods failed to become healthy"
          echo "Deployment revision ${REVISION} is UNSTABLE"
          echo ""

          echo "Checking if previous stable revision exists..."
          REV_COUNT=$(kubectl rollout history deployment/nginx-deployment | grep -c revision || true)

          if [ "$REV_COUNT" -le 1 ]; then
            echo ""
            echo "NO PREVIOUS STABLE REVISION FOUND"
            echo "Automatic rollback CANNOT be performed"
            echo "REQUIRED ACTION:"
            echo "   - Fix deployment configuration"
            echo "   - Or manually roll back once a stable revision exists"
            echo "   - Example: kubectl rollout undo deployment/nginx-deployment --to-revision=<REV>"
            exit 1
          fi

          echo ""
          echo "PREVIOUS STABLE REVISION FOUND"
          echo "Initiating automatic rollback to previous revision..."
          kubectl rollout undo deployment/nginx-deployment

          echo "Waiting for rollback to stabilize..."
          kubectl rollout status deployment/nginx-deployment --timeout=60s

          echo ""
          echo "Cleaning up unhealthy pods from failed rollout..."
          kubectl get pods \
            --selector=app=nginx \
            --field-selector=status.phase!=Running \
            -o name | xargs -r kubectl delete

          echo ""
          echo "ROLLBACK COMPLETED SUCCESSFULLY"
          echo "--------------------------------"
          echo "Previous stable revision has been RESTORED"
          echo "Failed revision ${REVISION} has been ABANDONED"
          echo "Unhealthy pods were REMOVED"
          echo "Cluster is now running LAST KNOWN GOOD STATE"
          echo ""

          exit 1
        fi

        echo ""
        echo "DEPLOYMENT ROLLOUT SUCCESSFUL"
        echo "--------------------------------"

    - name: Verify active deployment revision
      run: |
        echo ""
        echo "Verifying active deployment revision..."
        echo "Expected revision: ${REVISION}"

        ACTIVE_REVISIONS=$(kubectl get pods -l app=nginx \
          -o jsonpath='{range .items[*]}{.metadata.labels.app\.kubernetes\.io/revision}{"\n"}{end}' \
          | sort -u)

        echo "Detected active revision(s):"
        echo "$ACTIVE_REVISIONS"

        if echo "$ACTIVE_REVISIONS" | grep -q "^${REVISION}$"; then
          echo ""
          echo "DEPLOYMENT VERIFICATION SUCCESSFUL"
          echo "Revision ${REVISION} is now ACTIVE"
        else
          echo ""
          echo "DEPLOYMENT VERIFICATION FAILED"
          echo "Expected revision ${REVISION} is NOT running"
          echo "Active revision(s):"
          echo "$ACTIVE_REVISIONS"
          echo "Cluster may still be running a previous version"
          exit 1
        fi

    - name: Show final deployment and pod status
      run: |
        echo "Final Deployment Status"
        kubectl get deployment nginx-deployment -o wide

        echo ""
        echo "Final Pod Status"
        kubectl get pods -l app=nginx -o wide
