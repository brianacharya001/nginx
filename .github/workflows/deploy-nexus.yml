name: Deploy Nexus OSS (Minikube Self-Hosted)

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Minikube & Network
        run: |
          echo "Switching to Minikube context..."
          kubectl config use-context minikube
          
          echo "Checking cluster connectivity..."
          if ! kubectl get nodes; then
            echo "Error: Cannot reach Minikube. Is it running?"
            exit 1
          fi

      - name: Add Community Helm Repo
        run: |
          # Switching from deprecated Sonatype repo to SteveHipwell
          helm repo add stevehipwell https://stevehipwell.github.io/helm-charts/
          helm repo update

      - name: Deploy Nexus via Helm
        run: |
          helm upgrade --install nexus-repo stevehipwell/nexus3 \
            --namespace nexus \
            --create-namespace \
            -f charts/nexus/values.yaml \
            --wait \
            --timeout 10m

      - name: Final Connection Instructions
        run: |
          NODE_IP=$(minikube ip)
          NODE_PORT=$(kubectl get svc nexus-repo-nexus3 -n nexus -o jsonpath='{.spec.ports[0].nodePort}')
          echo "----------------------------------------------------------"
          echo "SUCCESS: Nexus is deploying."
          echo "Access URL: http://$NODE_IP:$NODE_PORT"
          echo "Default Credentials: admin / admin123 (if not changed)"
          echo "----------------------------------------------------------"
