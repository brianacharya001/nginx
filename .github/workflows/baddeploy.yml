name: Deploy Nginx (Fail & Rollback Demo)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set kubectl context
      run: kubectl config use-context minikube

    - name: Set deployment revision
      run: |
        REVISION=$(echo "${GITHUB_SHA}" | cut -c1-7)
        echo "REVISION=$REVISION" >> $GITHUB_ENV

    - name: Inject revision into manifests
      run: |
        sed -i "s/{{REVISION}}/${REVISION}/g" manifests/bad-deployment.yaml

    - name: Apply manifests (expected to fail)
      run: kubectl apply -f manifests/

    - name: Monitor rollout and rollback on failure
      run: |
        set +e
        kubectl rollout status deployment/nginx-deployment --timeout=60s
        STATUS=$?
        set -e

        if [ $STATUS -ne 0 ]; then
          echo "❌ Deployment failed"
          echo "↩️  Rolling back to the previous revision"

          kubectl rollout undo deployment/nginx-deployment
          kubectl rollout status deployment/nginx-deployment --timeout=60s

          echo "✅ Rollback completed — previous revision restored"
          exit 1
        fi

        echo "✅ Deployment successfully completed (unexpected)"

    - name: Show final deployment state
      run: kubectl get deployment nginx-deployment -o wide
