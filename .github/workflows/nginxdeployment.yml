name: Manual Nginx Deploy (Develop)

on:
  # Enables the "Run workflow" button in the GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy-to-local:
    # Must use your local machine's self-hosted runner
    runs-on: self-hosted
    
    # Optional: Safety check to ensure it only runs on the develop branch
    if: github.ref == 'refs/heads/development'

    steps:
      - name: Checkout Development Branch
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Ensure Minikube is Ready
        run: |
          # Start minikube if not already running
          minikube status || minikube start

      - name: Deploy Nginx to Minikube
        run: |
          # Apply deployment directly from the develop branch
          kubectl create deployment nginx-develop --image=nginx:latest --dry-run=client -o yaml | kubectl apply -f -
          
      - name: Expose and Verify
        run: |
          kubectl expose deployment nginx-develop --type=NodePort --port=80 --dry-run=client -o yaml | kubectl apply -f -
          kubectl get pods -l app=nginx-develop
          echo "Deployment successful on develop branch."
