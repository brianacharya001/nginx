name: dailyreport

on:
  # This allows manual trigger of the workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted  # Ensure you're using a self-hosted runner

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3  # Latest checkout version

      - name: Set up Python
        uses: actions/setup-python@v3  # Latest setup-python version
        with:
          python-version: "3.x"  # Ensure you're using a compatible Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the email code
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}  # Secrets for email
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          python send_email.py

