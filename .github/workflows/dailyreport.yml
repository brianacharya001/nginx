name: dailyreport

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      # Replace 'actions/setup-python' with this manual setup
      - name: Set up Python 3.9 (Manual)
        run: |
          # Verify python3.9 is installed
          python3.9 --version
          # Ensure pip is available for 3.9
          python3.9 -m ensurepip --upgrade
          # Add alias so subsequent 'python' commands use 3.9
          echo "python=python3.9" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python3.9 -m pip install --upgrade pip
          python3.9 -m pip install -r requirements.txt

      - name: Run the email code
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: |
          python3.9 send_email.py
