apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  annotations:
    app.kubernetes.io/revision: "{{REVISION}}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/revision: "{{REVISION}}"
    spec:
      containers:
      - name: nginx
        image: nginx:abcd1234
        ports:
        - containerPort: 80
