apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  annotations:
    app.kubernetes.io/revision: "${REVISION}"  # Use ${REVISION} instead of {{REVISION}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/revision: "${REVISION}"  # Use ${REVISION} here too
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
