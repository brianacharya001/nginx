apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
        # This label is used by the verification step in your template
        app.kubernetes.io/revision: "{{REVISION}}"
    spec:
      containers:
      - name: flask-container
        image: python:3.9-slim
        command: ["python", "-c"]
        # Inline script to run the app for simplicity in local minikube
        args: 
          - |
            from flask import Flask
            import os
            app = Flask(__name__)
            @app.route('/')
            def hello():
                rev = os.getenv('APP_REVISION', 'unknown')
                return f'Revision: {rev}'
            app.run(host='0.0.0.0', port=5000)
        ports:
        - containerPort: 5000
        env:
        - name: APP_REVISION
          value: "{{REVISION}}"
        resources:
          limits:
            cpu: "200m"
          requests:
            cpu: "100m"
