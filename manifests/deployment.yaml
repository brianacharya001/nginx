apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  annotations:
    app.kubernetes.io/revision: "{{REVISION}}"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
        app.kubernetes.io/revision: "{{REVISION}}"
    spec:
      containers:
        - name: nginx
          #image: nginx:latest
          image: nginx: bad
          ports:
            - containerPort: 80
