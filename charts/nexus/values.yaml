nexus:
  env:
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false" # Set to false for default admin/admin123 (Change immediately!)

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 20Gi

# If you have an ingress controller (Nginx/Traefik)
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
  path: /
  hosts:
    - nexus.example.com
