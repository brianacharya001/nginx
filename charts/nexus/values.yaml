nexus:
  env:
    - name: NEXUS_SECURITY_RANDOMPASSWORD
      value: "false"
  # Minikube specific: adjust resources if your laptop is struggling
  resources:
    requests:
      memory: "8Gi"
      cpu: "4"
    limits:
      memory: "8Gi"
      cpu: "4"

  # Tune startup probe to avoid Kubernetes marking pod unhealthy too early
  startupProbe:
    enabled: true
    initialDelaySeconds: 600   # wait 10 minutes before first check
    periodSeconds: 10           # check every 10s
    failureThreshold: 60        # allow ~10 minutes for startup probe to succeed
  logging:
    request:
      enabled: false
    audit:
      enabled: false
    tasks:
      enabled: false

persistence:
  enabled: true
  storageClass: "standard" # Minikube default storage class
  size: 8Gi

# Use NodePort for easy access in Minikube without an Ingress controller
service:
  type: NodePort
